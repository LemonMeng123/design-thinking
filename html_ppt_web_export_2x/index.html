  <style>
    :root {
      --stage-w: 1920;
      --stage-h: 1080;
      --bg: #050506;
      --green: #9cff35;
      --muted: rgba(255,255,255,.62);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
    }
    body { display: grid; place-items: center; }
    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      user-select: none;
    }
    .slide {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .slide.active { display: flex; }
    .slide img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .hud {
      position: fixed;
      left: 24px;
      right: 24px;
      bottom: 18px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    body:hover .hud, .hud.show { opacity: 1; }
    .counter, .hint {
      padding: 7px 12px;
      border: 1px solid rgba(156,255,53,.28);
      border-radius: 999px;
      background: rgba(0,0,0,.5);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .02em;
      backdrop-filter: blur(10px);
    }
    .counter strong { color: var(--green); font-weight: 800; }
    .nav-hit {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 38%;
      z-index: 5;
      padding: 0;
      border: 0;
      outline: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      color: transparent;
    }
    .nav-hit.prev { left: 0; cursor: w-resize; }
    .nav-hit.next { right: 0; cursor: e-resize; }
    .overview {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
      padding: 32px;
      overflow: auto;
      background: rgba(0,0,0,.92);
    }
    .overview.open { display: grid; }
    .thumb {
      position: relative;
      border: 1px solid rgba(255,255,255,.16);
      background: #111;
      padding: 0;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }
    .thumb.active { border-color: var(--green); box-shadow: 0 0 0 2px rgba(156,255,53,.22); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb span {
      position: absolute;
      left: 8px;
      bottom: 8px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(0,0,0,.72);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }
    @media print {
      html, body { overflow: visible; height: auto; }
      .deck { height: auto; }
      .slide { position: relative; display: flex !important; page-break-after: always; height: 100vh; }
      .hud, .nav-hit, .overview { display: none !important; }
    }
  </style>

  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    const thumbs = Array.from(document.querySelectorAll('.thumb'));
    const current = document.getElementById('current');
    const overview = document.getElementById('overview');
    const hud = document.getElementById('hud');
    let index = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.replace('#', ''), 10) || 1) - 1));
    let hudTimer;

    function showHud() {
      hud.classList.add('show');
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => hud.classList.remove('show'), 1300);
    }
    function render() {
      slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
      thumbs.forEach((thumb, i) => thumb.classList.toggle('active', i === index));
      current.textContent = String(index + 1).padStart(2, '0');
      const hash = '#' + String(index + 1).padStart(2, '0');
      if (location.hash !== hash) history.replaceState(null, '', hash);
      showHud();
    }
    function go(next) {
      index = Math.max(0, Math.min(slides.length - 1, next));
      render();
    }
    function step(delta) { go(index + delta); }
    function toggleOverview(force) {
      overview.classList.toggle('open', force ?? !overview.classList.contains('open'));
      showHud();
    }
    async function toggleFullscreen() {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
      else await document.exitFullscreen?.();
    }

    document.querySelector('.nav-hit.prev').addEventListener('click', () => step(-1));
    document.querySelector('.nav-hit.next').addEventListener('click', () => step(1));
    thumbs.forEach((thumb, i) => thumb.addEventListener('click', () => { go(i); toggleOverview(false); }));
    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['arrowright', 'pagedown', ' '].includes(key)) { event.preventDefault(); step(1); }
      if (['arrowleft', 'pageup', 'backspace'].includes(key)) { event.preventDefault(); step(-1); }
      if (key === 'home') go(0);
      if (key === 'end') go(slides.length - 1);
      if (key === 'o') toggleOverview();
      if (key === 'escape') toggleOverview(false);
      if (key === 'f') toggleFullscreen();
    });
    window.addEventListener('hashchange', () => {
      const next = (parseInt(location.hash.replace('#', ''), 10) || 1) - 1;
      if (next !== index) go(next);
    });
    render();
  </script>
